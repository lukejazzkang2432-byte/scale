<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#27003f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCALE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SCALE</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');
:root{
  --deep:#27003f;--soft:#e2dcfd;--yellow:#fed54c;--pink:#e0bfe6;--neon:#f59cd6;
  --ink:#000;--paper:#FFFCF3;--card:#fff;--gray:#7A7386;--line:#E7E1F0;
  --red:#E0455B;--green:#18A472;--ysoft:#FFF6D6;
  --r-lg:26px;--r-md:18px;--r-sm:13px;
  --pad:clamp(13px,4vw,22px);--fs:clamp(14px,3.9vw,17px);
  --tabh:calc(62px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
  background:var(--soft);color:var(--ink);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
input,select,textarea{outline:none}
#app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--paper);
  box-shadow:0 0 60px rgba(39,0,63,.16);display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;padding:0 var(--pad) calc(var(--tabh) + 26px)}

#gate,#splash{position:fixed;inset:0;z-index:70;background:var(--paper);display:none;overflow-y:auto}
#gate.on,#splash.on{display:block}
#splash{z-index:75;background:var(--deep)}
.g-wrap{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 40px) var(--pad) calc(env(safe-area-inset-bottom) + 40px)}
.g-logo{width:96px;height:96px;border-radius:26px;display:block;margin:0 auto 20px;
  border:3px solid var(--ink);box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink)}
.g-title{text-align:center;font-size:1.6em;font-weight:800;letter-spacing:-.04em;margin-bottom:6px}
.g-sub{text-align:center;font-size:.85em;font-weight:600;color:var(--gray);line-height:1.6;margin-bottom:26px}
.g-opt{width:100%;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-md);
  padding:16px;text-align:left;display:flex;align-items:center;gap:13px;margin-bottom:11px;box-shadow:0 4px 0 var(--ink)}
.g-opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.g-opt .e{width:44px;height:44px;border-radius:14px;background:var(--soft);border:2.5px solid var(--ink);
  display:grid;place-items:center;font-size:1.3em;flex:none}
.g-opt b{display:block;font-weight:800;font-size:.97em}
.g-opt span{display:block;font-size:.76em;color:var(--gray);font-weight:600;margin-top:1px}
.g-opt.primary{background:var(--deep);color:#fff}
.g-opt.primary .e{background:rgba(255,255,255,.16);border-color:#fff}
.g-opt.primary span{color:rgba(255,255,255,.8)}
.g-back{display:block;margin:18px auto 0;font-size:.83em;font-weight:700;color:var(--gray)}
.codebox{width:100%;background:var(--card);border:3px solid var(--ink);border-radius:var(--r-md);
  padding:18px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:1.5em;font-weight:800;
  letter-spacing:.22em;text-transform:uppercase}
#splash .g-title{color:#fff}
#splash .role{display:inline-block;background:var(--yellow);border:3px solid var(--ink);
  border-radius:999px;padding:6px 18px;font-weight:800;font-size:.9em;margin-bottom:14px}
#splash .hello{text-align:center;font-size:.92em;font-weight:600;color:rgba(255,255,255,.85);line-height:1.7}

.topbar{position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 10px;display:flex;align-items:center;gap:7px}
.brand{font-weight:800;font-size:1em;display:flex;align-items:center;gap:7px;min-width:0}
.brand svg{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.6em;font-weight:800;padding:4px 8px;border-radius:999px;border:2px solid var(--ink);flex:none}
.badge.owner{background:var(--yellow)}.badge.vice{background:#D6F5E7}
.badge.staff{background:var(--pink)}.badge.member{background:var(--line);color:var(--gray)}
.bell{margin-left:auto;position:relative;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);
  background:var(--card);display:grid;place-items:center;font-size:1em;flex:none}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border:2px solid var(--ink);
  border-radius:999px;font-size:.55em;font-weight:800;padding:1px 6px}
.sem{background:var(--deep);color:#fff;font-weight:700;font-size:.72em;padding:7px 11px;border-radius:999px;flex:none}

.todo{background:var(--deep);color:#fff;border:3px solid var(--ink);border-radius:var(--r-lg);
  margin:6px 0 18px;overflow:hidden;box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink)}
.todo-h{display:flex;align-items:center;gap:8px;padding:13px 16px 11px;font-weight:800;font-size:.9em}
.todo-h .c{background:var(--yellow);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:.78em}
.todo-l{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 16px;border-top:2px solid rgba(255,255,255,.16);color:#fff}
.todo-l .m{flex:1;min-width:0}
.todo-l b{display:block;font-weight:700;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-l span{display:block;font-size:.72em;opacity:.8;font-weight:600;margin-top:1px}
.todo-l .go{flex:none;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);
  border-radius:999px;padding:6px 12px;font-size:.72em;font-weight:800;white-space:nowrap}
.todo-e{padding:16px;text-align:center;font-size:.82em;font-weight:600;opacity:.8;border-top:2px solid rgba(255,255,255,.16)}

.ledger-top{display:flex;align-items:center;gap:9px;margin:10px 0 4px}
.ledger-top b{font-weight:800;font-size:.95em;letter-spacing:-.02em}
.ledger-top span{font-size:.74em;color:var(--gray);font-weight:600;margin-left:auto}
.wallet{position:relative;margin:6px 0 18px;background:var(--deep);color:#fff;
  border:3px solid var(--ink);border-radius:var(--r-lg);padding:20px 20px 16px;
  box-shadow:7px 7px 0 var(--yellow),7px 7px 0 3px var(--ink)}
.wallet .lbl{font-size:.8em;font-weight:700;opacity:.85}
.wallet .amt{font-size:clamp(30px,9vw,40px);font-weight:800;letter-spacing:-.045em;margin:2px 0 14px}
.wallet .amt small{font-size:.45em;font-weight:700;margin-left:3px;opacity:.8}
.wgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.wgrid>div,.wgrid>button{background:rgba(255,255,255,.14);border-radius:var(--r-sm);padding:8px 9px;text-align:left;color:#fff}
.wgrid b{display:block;font-size:.94em;font-weight:800;margin-top:1px}
.wgrid span{font-size:.69em;opacity:.85;font-weight:600}
.wgrid button.open{background:rgba(255,255,255,.28)}
.coin{position:absolute;right:16px;top:-13px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);
  border-radius:999px;font-size:.72em;font-weight:800;padding:4px 11px}
.pie{margin-top:14px;background:rgba(0,0,0,.22);border-radius:var(--r-md);padding:14px;display:flex;gap:14px;align-items:center}
.pie .lg{flex:1;min-width:0}
.pie .lg div{display:flex;align-items:center;gap:7px;font-size:.74em;font-weight:700;padding:2px 0}
.pie .lg i{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.pie .lg em{margin-left:auto;font-style:normal;opacity:.85}

.cal-nav{display:flex;gap:7px;align-items:center;margin-bottom:10px}
.cal-nav select{flex:1;padding:12px 8px}
.arw{width:42px;height:46px;flex:none;border:2.5px solid var(--ink);border-radius:var(--r-sm);
  background:var(--card);font-weight:800;font-size:1.1em;display:grid;place-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal-grid .wd{font-size:.69em;font-weight:800;color:var(--gray);padding-bottom:4px}
.cel{aspect-ratio:1;display:grid;place-items:center;position:relative}
.cel .o{width:82%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:.79em;font-weight:700;color:var(--gray);z-index:1;position:relative}
.cel.today .o{box-shadow:0 0 0 3px var(--yellow)}
.cel.rec .o::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--deep)}
.cel.due .o{background:var(--yellow);border:2.5px solid var(--ink);color:var(--ink);font-weight:800}
.cel.due::before{content:'🗳';position:absolute;top:-3px;right:5%;font-size:.6em;z-index:2;
  background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 3px;line-height:1.35}
.cel.urg .o{background:var(--red);color:#fff;border-color:var(--ink)}
.cel.urg::before{content:'🔴';background:#fff}
.cel.p-single,.cel.p-start,.cel.p-mid,.cel.p-end{background:rgba(245,156,214,.45)}
.cel.p-single{border-radius:999px}.cel.p-start{border-radius:999px 0 0 999px}.cel.p-end{border-radius:0 999px 999px 0}
.legend{display:flex;gap:12px;justify-content:center;margin-top:13px;font-size:.7em;font-weight:700;color:var(--gray);flex-wrap:wrap}
.legend i{display:inline-block;width:15px;height:10px;border-radius:99px;background:rgba(245,156,214,.6);
  border:1.5px solid var(--ink);margin-right:4px;vertical-align:middle}
.legend i.d{width:11px;height:11px;border-radius:50%;background:var(--yellow)}
.legend i.r{width:7px;height:7px;border-radius:50%;background:var(--deep);border:none}

.card{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-lg);
  padding:15px;margin-bottom:12px;width:100%;text-align:left;display:block}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.card .hd b{font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:.76em;color:var(--gray);font-weight:600}
.card.urgent{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,69,91,.22);background:#FFF4F5}
.tagline{font-size:.7em;font-weight:800;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.t-live{background:var(--yellow)}.t-end{background:var(--line);color:var(--gray);border-color:var(--line)}
.t-new{background:var(--neon)}.t-done{background:#D6F5E7}.t-vote{background:var(--soft)}.t-red{background:#FFE0E5}
.t-urg{background:var(--red);color:#fff}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;border:2px solid var(--ink);margin:5px 0 3px}
.bar i{display:block;height:100%;background:var(--deep)}

.block{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:14px 15px}
.chip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.1em;border:2.5px solid var(--ink);flex:none}
.chip.party{background:var(--deep);color:#fff}.chip.in{background:var(--yellow)}.chip.out{background:var(--pink)}
.block-head .t{font-weight:800}.block-head .s{font-size:.74em;color:var(--gray);font-weight:600}
.plus{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:1.25em;font-weight:700;display:grid;place-items:center;flex:none}
.rows{border-top:2px dashed var(--line);max-height:236px;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:700;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:.73em;color:var(--gray);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:800;white-space:nowrap}
.row .v.minus{color:var(--red)}.row .v.plus2{color:var(--green)}
.donut{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:.57em;font-weight:800;border:2.5px solid var(--ink)}
.donut i{background:var(--card);width:66%;height:66%;border-radius:50%;display:grid;place-items:center;font-style:normal}
.more{width:100%;padding:11px;font-weight:700;font-size:.79em;color:var(--deep);background:var(--soft);border-top:1px solid var(--line)}
.owe{background:var(--ysoft);border:2.5px solid var(--ink);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.owe-h{display:flex;align-items:center;gap:9px;padding:13px 15px;font-weight:800;font-size:.9em}
.owe-h .n{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-size:.78em}
.owe-l{display:flex;align-items:center;padding:10px 15px;border-top:1px dashed var(--ink);font-size:.87em}
.owe-l .c{color:var(--gray);font-size:.85em;font-weight:600;margin-left:6px}
.owe-l .a{margin-left:auto;font-weight:800}

.sec-title{font-weight:800;font-size:.82em;margin:22px 0 9px;display:flex;align-items:center;gap:7px}
.sec-title::after{content:'';flex:1;height:2px;background:var(--line)}
.mini{font-size:.76em;color:var(--gray);font-weight:600;line-height:1.6}
.empty{padding:18px;text-align:center;color:var(--gray);font-size:.81em;font-weight:600;
  border:2.5px dashed var(--line);border-radius:var(--r-lg);margin-bottom:12px}

.tabbar{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:9px 0 8px;text-align:center;font-size:.6em;font-weight:700;color:var(--gray)}
.tab .ico{display:block;font-size:1.32em;line-height:1.15;filter:grayscale(1) opacity(.5)}
.tab.on{color:var(--deep)}.tab.on .ico{filter:none}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;z-index:51;transform:translateX(-50%);
  background:var(--paper);border-radius:28px 28px 0 0;border-top:3px solid var(--ink);
  max-height:92dvh;display:none;flex-direction:column}
.sheet.on{display:flex;animation:up .24s cubic-bezier(.2,.9,.3,1)}
.sheet.down{animation:dn .26s cubic-bezier(.4,0,.8,.4) forwards}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes dn{from{transform:translate(-50%,0)}to{transform:translate(-50%,100%)}}
.grab{width:44px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px var(--pad) 10px;border-bottom:2px dashed var(--line)}
.sheet-head h2{margin:0;font-size:1.02em;font-weight:800}
.sheet-body{overflow-y:auto;padding:16px var(--pad) calc(22px + env(safe-area-inset-bottom))}
.x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800}

.f{margin-bottom:14px}
.f>label{display:block;font-size:.78em;font-weight:800;margin-bottom:6px}
.f .hint{font-size:.71em;color:var(--gray);font-weight:600;margin-top:5px}
.lblrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lblrow>label{font-size:.78em;font-weight:800}
.lblrow .sp{margin-left:auto;display:flex;gap:5px}
.chipbtn{border:2px solid var(--ink);border-radius:999px;padding:5px 11px;font-size:.71em;font-weight:800;background:var(--card)}
.chipbtn.y{background:var(--yellow)}.chipbtn.n{background:var(--line);color:var(--gray)}
.inp{width:100%;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:12px 13px;font-weight:600}
textarea.inp{min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.seg button{border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:12px 6px;font-weight:800;background:var(--card);font-size:.87em}
.seg button.on{background:var(--deep);color:#fff}
.btn{width:100%;background:var(--deep);color:#fff;border:2.5px solid var(--ink);border-radius:var(--r-md);
  padding:15px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.warn{background:var(--red)}
.btn.small{padding:11px;font-size:.85em;box-shadow:0 3px 0 var(--ink)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.plist{border:2.5px solid var(--ink);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.plist.sc{max-height:300px;overflow-y:auto}
.pl-head{display:flex;padding:9px 13px;background:var(--ink);color:#fff;font-size:.7em;font-weight:800}
.pl-head .a,.pl-head .b{width:66px;text-align:center}.pl-head .a{margin-left:auto}
.prow{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);gap:6px}
.prow:last-child{border-bottom:none}
.prow .nm{flex:1;min-width:0;font-weight:700;font-size:.89em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm em{display:block;font-style:normal;font-size:.75em;color:var(--gray);font-weight:600}
.prow.off .nm{color:var(--gray);text-decoration:line-through}
.tg{width:66px;flex:none;border:2px solid var(--ink);border-radius:999px;padding:6px 0;font-size:.71em;font-weight:800;text-align:center;background:var(--card)}
.tg.on,.tg.att{background:var(--yellow)}
.tg.no,.tg.abs{background:#EFEBF5;color:var(--gray);border-color:var(--line)}
.tg.done{background:var(--green);color:#fff}.tg.undone{background:#EFEBF5;color:var(--gray);border-color:var(--line)}
.tg.sm{width:52px;font-size:.67em}
.amt-in{width:92px;flex:none;border:2px solid var(--ink);border-radius:10px;padding:7px 9px;text-align:right;font-weight:700;font-size:.84em}
.pick{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--ink);flex:none;display:grid;place-items:center;font-size:.8em;font-weight:800;background:var(--card)}
.pick.on{background:var(--deep);color:#fff}
.calc{background:var(--ysoft);border:2.5px dashed var(--ink);border-radius:var(--r-md);padding:14px;margin-bottom:14px}
.calc .l{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;padding:3px 0}
.calc .l.big{font-size:1.1em;font-weight:800;border-top:2px solid var(--ink);margin-top:7px;padding-top:8px}
.calc .l small{color:var(--gray);font-weight:600;font-size:.78em}
.calcavg{background:var(--ysoft);border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:.85em;font-weight:700;margin-bottom:10px}
.calcavg b{font-size:1.15em}
.qbox{border:2.5px solid var(--ink);border-radius:var(--r-md);padding:14px;margin-bottom:12px;background:var(--card)}
.qbox .qh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.qbox .qh b{font-size:.82em;font-weight:800;flex:1}
.del{background:#FFE0E5;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:.7em;font-weight:800;flex:none}
.opt{border:2.5px solid var(--ink);border-radius:var(--r-md);padding:12px 14px;margin-bottom:9px;
  background:var(--card);width:100%;text-align:left;font-weight:700;display:flex;align-items:center;gap:10px}
.opt.on{background:var(--soft)}
.opt .mk{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink);flex:none;display:grid;place-items:center;font-size:.7em;font-weight:800}
.opt.on .mk{background:var(--deep);color:#fff}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:12px 0;font-weight:800;background:var(--card)}
.scale button.on{background:var(--deep);color:#fff}

@media print{
  body{background:#fff}
  #app,.scrim,.sheet,.toast,#gate,#splash,.ask{display:none!important}

<script>
/* ═════ Firebase ═════ */
const EMBED_CFG={
  apiKey:"AIzaSyD5YrglrzgjbNxQmIwga-8TRnGmc3fXscU",
  authDomain:"scalejungsan1launch.firebaseapp.com",
  projectId:"scalejungsan1launch",
  storageBucket:"scalejungsan1launch.firebasestorage.app",
  messagingSenderId:"52732836281",
  appId:"1:52732836281:web:054742fbd7cadf41121e68"
};
const COL='clubs',ICOL='cinvites';
const APPVER='v6 · 출석·임시정산';
const VAPID="BG_uqgvcYWnrzKtZJkbrRMlsGdh7ofRCBLBg4qJ1U_2KX5G4IhVPeTddbo6OyDu9jt2rYxizBVZ89-GyINgANHc";

/* ═════ 공통 ═════ */
const T=new Date();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
const esc=s=>String(s??'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,8);
const rnd=n=>Array.from({length:n},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
function wonM(n){
  if(canWrite())return won(n);
  const v=DB.balanceView||'full';
  if(v==='full')return won(n);
  if(v==='hidden')return '***';
  const s=won(Math.round(n||0));
  return s[0]+s.slice(1).replace(/[0-9]/g,'*');
}
const num=v=>+String(v??'').replace(/[^0-9]/g,'')||0;
const ceilTo=(n,u)=>u>1?Math.ceil(n/u)*u:Math.ceil(n);
const WD='일월화수목금토';
const dl=s=>{const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';};
const dleft=s=>{const d=Math.ceil((new Date(s+'T23:59:59')-new Date())/864e5);
  return d<0?'마감':d===0?'오늘 마감':`${d}일 남음`;};
const ended=s=>new Date(s+'T23:59:59')<new Date();
const ko=(a,b)=>String(a).localeCompare(String(b),'ko');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._z);t._z=setTimeout(()=>t.classList.remove('on'),2600);}

/* ═════ 직무 ═════ */
const ROLE_DEF={owner:'학회장',vice:'부학회장',staff:'운영진',member:'학회원'};
const ROLE_DESC={owner:'모든 권한',vice:'영구삭제·초대만 제외',staff:'기록과 투표 작성',member:'열람과 참여'};
let ROLE={...ROLE_DEF};
const LV={owner:4,vice:3,staff:2,member:1};

/* ═════ 상태 ═════ */
const MKEY='scale_me',DKEY='scale_db';
let ME=JSON.parse(localStorage.getItem(MKEY)||'null')||{id:'',name:'',role:'',club:''};
const saveME=()=>localStorage.setItem(MKEY,JSON.stringify(ME));
const DEF={
  name:'SCALE',roleNames:{...ROLE_DEF},
  members:[],invites:{},
  events:[],polls:[],posts:[],dms:[],notifs:[],
  records:[],carry:{},roundUnit:100,account:{bank:'',number:'',holder:''},balanceView:'full',
  categories:['식비','물품 구매','대관료','행사비','간식/다과','교통비','인쇄/제작','기타'],
  push:{post:true,rsvp:true,poll:true,dm:true,paid:true}
};
let DB=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(DKEY)||'null')||{});
function syncRoles(){ROLE={...ROLE_DEF,...(DB.roleNames||{})};}
syncRoles();
const saveDB=()=>{localStorage.setItem(DKEY,JSON.stringify(DB));if(ME.club)cloudPush();};

const R=()=>ME.club?(ME.role||''):'owner';
const lv=()=>LV[R()]||0;
const isOwner=()=>lv()>=4;
const canManage=()=>lv()>=3;   // 회원 추가·탈퇴, 설정
const canWrite=()=>lv()>=2;    // 기록·투표·공지 작성
const canPurge=()=>lv()>=4;
const canInvite=()=>lv()>=4;
const blocked=()=>!!ME.club&&!R();
function gW(){if(canWrite())return true;toast('열람 권한이에요. '+ROLE.owner+'에게 문의하세요');return false;}
function gM(){if(canManage())return true;toast(ROLE.owner+'·'+ROLE.vice+'만 가능해요');return false;}
function gO(){if(isOwner())return true;toast(ROLE.owner+'만 가능해요');return false;}

const members=()=>DB.members.filter(m=>!m.blocked&&m.active!==false).sort((a,b)=>ko(a.name,b.name));
const allMembers=()=>DB.members.slice().sort((a,b)=>ko(a.name,b.name));
const nameOf=id=>DB.members.find(m=>m.id===id)?.name||'';
const recovery=id=>ME.club?ME.club+'-'+id:'';

/* ═════ 학기 ═════ */
function semOf(d){const y=d.getFullYear(),m=d.getMonth()+1;
  if(m>=3&&m<=8)return{y,t:1};if(m>=9)return{y,t:2};return{y:y-1,t:2};}
const semKey=o=>o.y+'-'+o.t;
const semOfDate=s=>semKey(semOf(new Date(s+'T00:00:00')));
const semLabel=k=>{const[y,t]=k.split('-');return y.slice(2)+'년 '+t+'학기';};
function semList(){const c=semOf(new Date()),minY=Math.max(2026,c.y-2),out=[];
  for(let y=minY;y<=c.y;y++)for(const t of[1,2]){if(y===c.y&&t>c.t)continue;out.push(y+'-'+t);}return out.reverse();}
let CUR=localStorage.getItem('scale_sem')||semKey(semOf(new Date()));
if(!semList().includes(CUR))CUR=semList()[0];
const setSem=k=>{CUR=k;localStorage.setItem('scale_sem',k);render();};
const recs=()=>DB.records.filter(r=>semOfDate(r.date)===CUR).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

/* ═════ 장부 계산 ═════ */
function partyCalc(r){
  const att=(r.people||[]).filter(p=>p.attend),n=att.length;
  const net=Math.max(0,(+r.total||0)-(+r.support||0));
  const per=n?ceilTo(net/n,r.unit||DB.roundUnit):0;
  const paid=att.filter(p=>p.paid).length;
  return{n,net,per,paid,unpaid:n-paid,collected:per*paid,extra:per*n-net,pct:n?Math.round(paid/n*100):0};
}
function balance(){
  let inc=0,out=0,sup=0;
  recs().forEach(r=>{
    if(r.kind==='income')inc+=(r.entries||[]).reduce((s,e)=>s+(+e.amount||0),0);
    if(r.kind==='expense'&&(r.payer==='card'||r.reimbursed))out+=(+r.amount||0);
    if(r.kind==='party')sup+=(+r.support||0);});
  const carry=+DB.carry[CUR]||0;
  return{carry,inc,out,sup,bal:carry+inc-out-sup};
}
function outBreakdown(){
  const m={};
  recs().forEach(r=>{
    if(r.kind==='expense'&&(r.payer==='card'||r.reimbursed))m[r.category||'기타']=(m[r.category||'기타']||0)+(+r.amount||0);
    if(r.kind==='party'&&+r.support>0)m['뒤풀이 지원']=(m['뒤풀이 지원']||0)+(+r.support||0);});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function unpaidByPerson(){
  const m={};
  recs().filter(r=>r.kind==='party').forEach(r=>{
    const c=partyCalc(r);
    (r.people||[]).filter(p=>p.attend&&!p.paid).forEach(p=>{
      if(!m[p.name])m[p.name]={name:p.name,n:0,total:0,last:''};
      m[p.name].n++;m[p.name].total+=c.per;m[p.name].last=r.place||'뒤풀이';});});
  return Object.values(m).sort((a,b)=>b.total-a.total);
}

/* ═════ 투표 시간 ═════ */
const dueAt=p=>new Date(p.due+'T'+(p.dueT||'23:59')+':59');
const msLeft=p=>dueAt(p)-new Date();
const isEnded=p=>msLeft(p)<=0;
const isUrgent=p=>{const m=msLeft(p);return m>0&&m<=2*3600e3;};
function leftLabel(p){const m=msLeft(p);if(m<=0)return '마감';
  const h=Math.floor(m/3600e3),mi=Math.floor(m%3600e3/60000);
  if(m<=2*3600e3)return h?`${h}시간 ${mi}분 남음`:`${mi}분 남음`;
  if(m<24*3600e3)return `${h}시간 남음`;
  return `${Math.ceil(m/864e5)}일 남음`;}
const dueLabel=p=>dl(p.due)+' '+(p.dueT||'23:59');
const forMe=p=>!p.to||p.to.includes(ME.id)||isOwner();
const didPoll=p=>(p.done||[]).includes(ME.id);
const didRead=p=>(p.readers||[]).includes(ME.id);
const myPush=()=>(DB.members.find(m=>m.id===ME.id)?.push)||{post:true,rsvp:true,poll:true,dm:true,paid:true};
const REMS={'7d':'7일 전','3d':'3일 전','1d':'하루 전','12h':'12시간 전','3h':'3시간 전','1h':'1시간 전'};
function remLabel(r){
  if(r.mode==='abs')return `${r.date?r.date.slice(5).replace('-','/'):''} ${r.time||''}`.trim();
  return `마감 ${r.n}${r.unit==='d'?'일':'시간'} 전${r.unit==='d'&&r.time?' '+r.time:''}`;}
const postRemLabel=r=>`매주 ${WD[r.dow]}요일 ${r.time}`;

/* ═════ 알림 ═════ */
function notify(to,title,body,kind,red){
  DB.notifs=DB.notifs||[];
  DB.notifs.unshift({id:uid(),to,title,body,kind:kind||'post',red:!!red,at:Date.now(),read:false,pushed:false});
  DB.notifs=DB.notifs.slice(0,150);
}
const myNotifs=()=>(DB.notifs||[]).filter(n=>!n.to||n.to.includes(ME.id));
const agoLabel=t=>{const m=Math.floor((Date.now()-t)/60000);
  return m<1?'방금':m<60?m+'분 전':m<1440?Math.floor(m/60)+'시간 전':Math.floor(m/1440)+'일 전';};

/* ═════ 클라우드 ═════ */
let FB={db:null,unsub:null,doc:null,lastPush:0};
const timeout=(p,ms=20000,msg='서버 응답이 없어요. 잠시 후 다시 시도해주세요')=>
  Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error(msg)),ms))]);
function loadFB(){
  return new Promise((res,rej)=>{
    if(window.firebase?.firestore)return res();
    const add=s=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=no;document.head.appendChild(e);});
    add('https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js')
      .then(()=>add('https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.js'))
      .then(()=>add('https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-messaging-compat.js').catch(()=>{}))
      .then(res).catch(rej);});
}
async function cloudInit(){
  try{
    await loadFB();
    if(!firebase.apps.length)firebase.initializeApp(EMBED_CFG);
    FB.db=firebase.firestore();
    try{FB.db.settings({experimentalForceLongPolling:true,merge:true});}catch(_){}
    if(ME.club)subscribe();
    return true;
  }catch(e){console.error(e);
    toast(location.protocol==='file:'?'파일을 직접 열면 연결이 안 돼요. 배포 주소로 접속해주세요':'연결 실패: '+(e.code||e.message||''));
    return false;}
}
function subscribe(){
  if(!FB.db||!ME.club)return;
  FB.unsub?.();
  FB.doc=FB.db.collection(COL).doc(ME.club);
  FB.unsub=FB.doc.onSnapshot(d=>{
    if(!d.exists)return;
    const v=d.data();
    if((v.updatedAt||0)>FB.lastPush&&v.data){
      DB=Object.assign(structuredClone(DEF),v.data);
      localStorage.setItem(DKEY,JSON.stringify(DB));
    }
    const me=DB.members.find(m=>m.id===ME.id);
    if(!me||me.blocked){ME.role='';saveME();showGate('blocked');return;}
    ME.role=me.role;ME.name=me.name;saveME();
    if(GATE==='blocked')showGate(null);
    syncRoles();renderQuiet();
  },()=>toast('동기화가 끊겼어요'));
}
function cloudPush(){
  if(!FB.doc)return;
  FB.lastPush=Date.now();
  FB.doc.set({data:DB,updatedAt:FB.lastPush},{merge:true}).catch(()=>toast('클라우드 저장 실패'));
}
async function createClub(name,cname){
  const id=rnd(10);
  ME={id:uid(),name,role:'owner',club:id};

  DB.members=[{id:ME.id,name,role:'owner',blocked:false,app:true}];
  await timeout(FB.db.collection(COL).doc(id).set({title:DB.name,data:DB,updatedAt:Date.now(),createdAt:Date.now()}));
  saveME();localStorage.setItem(DKEY,JSON.stringify(DB));subscribe();
}
async function makeInvite(who){
  const code=rnd(8);
  await timeout(FB.db.collection(ICOL).doc(code).set({club:ME.club,createdAt:Date.now()}));
  DB.invites=DB.invites||{};
  DB.invites[code]={who,used:false,createdAt:Date.now()};
  saveDB();return code;
}
async function redeem(code,name){
  const inv=await timeout(FB.db.collection(ICOL).doc(code).get());
  if(!inv.exists)throw new Error('없는 초대코드예요');
  const cid=inv.data().club;
  const ref=FB.db.collection(COL).doc(cid);
  const snap=await timeout(ref.get());
  if(!snap.exists)throw new Error('장부를 찾을 수 없어요');
  const d=snap.data().data||{};
  const meta=(d.invites||{})[code];
  if(!meta)throw new Error('만료된 초대코드예요');
  if(meta.used)throw new Error('이미 사용된 초대코드예요');
  if(meta.canceled)throw new Error('취소된 초대코드예요');
  const myId=uid();
  d.members=d.members||[];
  const same=d.members.find(m=>m.name===name&&!m.app);
  if(same){same.id=myId;same.app=true;}
  else d.members.push({id:myId,name,role:'member',blocked:false,app:true});
  d.invites[code]={...meta,used:true,usedBy:myId,usedName:name,usedAt:Date.now()};
  await timeout(ref.set({data:d,updatedAt:Date.now()},{merge:true}));
  ME={id:myId,name,role:'member',club:cid};
  DB=Object.assign(structuredClone(DEF),d);
  saveME();localStorage.setItem(DKEY,JSON.stringify(DB));subscribe();
}
async function restore(raw){
  const i=raw.lastIndexOf('-');
  if(i<1)throw new Error('복구 코드 형식이 아니에요');
  const cid=raw.slice(0,i).trim(),myId=raw.slice(i+1).trim();
  const snap=await timeout(FB.db.collection(COL).doc(cid).get());
  if(!snap.exists)throw new Error('그런 장부가 없어요');
  const d=snap.data().data||{};
  const me=(d.members||[]).find(m=>m.id===myId);
  if(!me)throw new Error('이 코드는 등록된 사람이 아니에요');
  ME={id:myId,name:me.name,role:me.role,club:cid};
  DB=Object.assign(structuredClone(DEF),d);
  saveME();localStorage.setItem(DKEY,JSON.stringify(DB));subscribe();
}

async function showLocal(title,body,red){
  try{
    const reg=await navigator.serviceWorker.getRegistration('./')||await navigator.serviceWorker.ready;
    if(reg&&reg.showNotification){
      await reg.showNotification(title,{body,
        icon:red?'icon-urgent.png':'icon-192.png',badge:'icon-192.png',
        tag:'scale-'+Date.now(),requireInteraction:!!red});
      return true;
    }
    new Notification(title,{body,icon:red?'icon-urgent.png':'icon-192.png'});
    return true;
  }catch(e){console.error(e);return false;}
}
async function registerPush(silent){
  if(!('Notification'in window)){if(!silent)toast('이 브라우저는 알림을 지원하지 않아요');return false;}
  if(!ME.club){if(!silent)toast('먼저 참여해주세요');return false;}
  let perm=Notification.permission;
  if(perm==='default'&&!silent)perm=await Notification.requestPermission();
  if(perm!=='granted'){if(!silent)toast('알림이 차단됐어요. 폰 설정에서 허용해주세요');return false;}
  try{
    if(!FB.db)await cloudInit();
    if(!window.firebase?.messaging){if(!silent)toast('알림 모듈을 불러오지 못했어요');return false;}
    let reg=await navigator.serviceWorker.getRegistration('./');
    if(!reg)reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const msg=firebase.messaging();
    const token=await msg.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
    if(!token){if(!silent)toast('토큰을 받지 못했어요');return false;}
    const m=DB.members.find(x=>x.id===ME.id);
    if(m&&m.token!==token){m.token=token;m.tokenAt=Date.now();saveDB();}
    msg.onMessage(pl=>{
      const n=pl.notification||pl.data||{};
      toast(n.title||'새 알림');
      showLocal(n.title||'SCALE',n.body||'',false);
    });
    if(!silent)toast('알림이 켜졌어요');
    return true;
  }catch(e){console.error(e);if(!silent)toast('알림 등록 실패: '+(e.code||e.message||''));return false;}
}

function syncAttToRec(e){
  const rec=linkedRec(e);if(!rec)return;
  const at=e.attend||{};
  members().forEach(m=>{
    let p=rec.people.find(x=>x.id===m.id);
    if(!p){p={id:m.id,name:m.name,attend:false,paid:false};rec.people.push(p);}
    if(at[m.id])p.attend=true;
  });
}

const CCOL=['#27003f','#fed54c','#f59cd6','#7C2AE8','#18A472','#e0bfe6','#E0455B','#5AC8FA'];
function donutSVG(bd,total){
  if(!total)return `<svg width="92" height="92" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/></svg>`;

  bd.forEach(([k,v],i)=>{const p=v/total*100;
    seg+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${CCOL[i%8]}" stroke-width="7" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`;
    off=(off-p+100)%100;});
  return `<svg width="92" height="92" viewBox="0 0 42 42" style="flex:none;transform:rotate(-90deg)">
    <circle cx="21" cy="21" r="15.9" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>${seg}</svg>`;
}
function lblock(kind,ico,title,sub){

const byTag=r=>r.author?` · ✍️${esc(r.author)}`:'';

const qType=t=>({single:'객관식',multi:'복수선택',short:'단답',long:'장문',scale:'5점 척도',date:'날짜'}[t]||t);
function answerUI(q,qi){

    return q.opts.map((o,i)=>`<button class="opt" data-act="pick" data-q="${qi}" data-i="${i}" data-multi="${q.type==='multi'}">

    `<button data-act="scale" data-q="${qi}" data-n="${n}">${n}</button>`).join('')}</div>

  if(q.type==='long')return `<textarea class="inp" data-ans="${qi}" placeholder="자유롭게 적어주세요"></textarea>`;
  if(q.type==='date')return `<input class="inp" type="date" data-ans="${qi}">`;

function pieSVG(items,total){
  if(!total)return '<div class="mini">아직 응답이 없어요</div>';
  let off=25,seg='';
  items.forEach((o,i)=>{const pc=o.v/total*100;
    seg+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${CCOL[i%8]}" stroke-width="9"
      stroke-dasharray="${pc.toFixed(2)} ${(100-pc).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`;
    off=(off-pc+100)%100;});
  return `<div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">
    <svg width="104" height="104" viewBox="0 0 42 42" style="flex:none;transform:rotate(-90deg)">
      <circle cx="21" cy="21" r="15.9" fill="none" stroke="#E7E1F0" stroke-width="9"/>${seg}</svg>
    <div style="flex:1;min-width:0">${items.map((o,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:.78em;font-weight:700;padding:2px 0">
      <i style="width:11px;height:11px;border-radius:3px;background:${CCOL[i%8]};flex:none;display:inline-block"></i>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.t)}</span>
      <b>${Math.round(o.v/total*100)}%</b></div>`).join('')}</div></div>`;
}
function barSVG(items,total){

    <div style="display:flex;font-weight:700;font-size:.86em"><span>${esc(o.t)}</span>

    <div class="bar"><i style="width:${Math.round(o.v/total*100)}%;background:${CCOL[i%8]}"></i></div></div>`).join('');
}
function scaleBlock(p,q){

function textBlock(p,q){

function resultView(p){

    return `<div class="qbox"><div class="qh"><b>Q${qi+1}. ${esc(q.q)}</b>
      <span class="tagline t-vote">${qType(q.type)}</span></div>

function toCSV(p){
  const tgt=p.to?p.to.length:members().length;
  const rows=[[p.kind==='vote'?'투표':'설문',p.title],['설명',p.desc||''],['마감',dueLabel(p)],
    ['참여',`${p.responses}/${tgt}명`],['익명',p.anon?'예':'아니오'],[]];
  p.qs.forEach((q,i)=>{
    rows.push([`Q${i+1}`,q.q,qType(q.type)]);
    if(q.type==='single'||q.type==='multi'){
      const tot=q.opts.reduce((s,x)=>s+x.v,0)||1;
      rows.push(['','선택지','표','비율']);
      q.opts.forEach(o=>rows.push(['',o.t,o.v,Math.round(o.v/tot*100)+'%']));
    }else if(q.type==='scale'){
      const arr=(p.scales||{})[q.id]||[];
      const avg=arr.length?(arr.reduce((s,x)=>s+x,0)/arr.length).toFixed(2):'-';
      rows.push(['','평균',avg]);
      [1,2,3,4,5].forEach(n=>rows.push(['',n+'점',arr.filter(x=>x===n).length]));
    }else{((p.texts||{})[q.id]||[]).forEach((t,j)=>rows.push(['',`응답 ${j+1}`,t]));}
    rows.push([]);});
  const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${p.title}_결과_${iso(new Date())}.csv`;a.click();
  toast('엑셀 파일을 내려받았어요');
}
function toPDF(p){
  const tgt=p.to?p.to.length:members().length;
  const body=p.qs.map((q,i)=>{
    const tot=(q.opts||[]).reduce((s,x)=>s+x.v,0)||1;
    let inner='';
    if(q.type==='single'||q.type==='multi'){
      inner=`<table><tr><th>선택지</th><th>표</th><th>비율</th></tr>
        ${q.opts.map(o=>`<tr><td>${esc(o.t)}</td><td>${o.v}</td><td>${Math.round(o.v/tot*100)}%</td></tr>`).join('')}</table>`;
    }else if(q.type==='scale'){
      const arr=(p.scales||{})[q.id]||[];
      const avg=arr.length?(arr.reduce((s,x)=>s+x,0)/arr.length).toFixed(2):'-';
      inner=`<p><b>평균 ${avg} / 5.00</b> (${arr.length}명)</p><table><tr><th>점수</th><th>응답</th></tr>
        ${[1,2,3,4,5].map(n=>`<tr><td>${n}점</td><td>${arr.filter(x=>x===n).length}</td></tr>`).join('')}</table>`;
    }else{
      const arr=(p.texts||{})[q.id]||[];
      inner=arr.length?`<ol>${arr.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:'<p>응답 없음</p>';}
    return `<h3>Q${i+1}. ${esc(q.q)} <small>(${qType(q.type)})</small></h3>${inner}`;}).join('');
  document.getElementById('print').innerHTML=`
    <div class="pbadge">${esc(DB.name)} · ${p.kind==='vote'?'투표':'설문'} 결과</div>
    <h1>${esc(p.title)}</h1>
    <p class="pmeta">${esc(p.desc||'')}<br>마감 ${dueLabel(p)} · 참여 ${p.responses}/${tgt}명${p.anon?' · 익명':''}
    <br>출력 ${new Date().toLocaleString('ko-KR')}</p>${body}`;
  setTimeout(()=>window.print(),100);
}

/* ═════ 공통 시트 ═════ */
function open_(t,h){
  document.getElementById('sheetTitle').textContent=t;
  document.getElementById('sheetBody').innerHTML=h;
  const s=document.getElementById('sheet');s.classList.remove('down');s.classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheetBody').scrollTop=0;
}
function close_(slide){
  const s=document.getElementById('sheet');
  if(slide){s.classList.add('down');setTimeout(()=>s.classList.remove('on','down'),250);}
  else s.classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  DRAFT=BUILD=POST=DM=null;
}
document.getElementById('scrim').onclick=()=>close_(true);
function ask(title,msg,ok='삭제',danger=true){
  return new Promise(res=>{
    const w=document.getElementById('ask'),sc=document.getElementById('ascrim');
    w.querySelector('h3').textContent=title;w.querySelector('p').innerHTML=msg;
    const y=w.querySelector('[data-ok]'),n=w.querySelector('[data-no]');
    y.textContent=ok;y.className='btn small '+(danger?'warn':'');
    const done=v=>{w.classList.remove('on');sc.classList.remove('on');y.onclick=n.onclick=sc.onclick=null;res(v);};
    y.onclick=()=>done(true);n.onclick=()=>done(false);sc.onclick=()=>done(false);
    w.classList.add('on');sc.classList.add('on');});
}
function askText(title,label,def=''){
  return new Promise(res=>{
    open_(title,`<div class="f"><label>${label}</label><input class="inp" id="askInput" value="${esc(def)}"></div>
      <button class="btn" data-act="askOk">확인</button>`);
    window._askRes=res;});
}
function copy(t){
  const ok=()=>toast('복사했어요');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');ok();}catch(_){toast('복사 실패');}ta.remove();};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}
function pull(){
  if(!DRAFT)return;
  document.querySelectorAll('#sheetBody [data-f]').forEach(el=>{
    const k=el.dataset.f;
    DRAFT[k]=['total','support','amount','sameAmt'].includes(k)?num(el.value):el.value;});
  document.querySelectorAll('#sheetBody [data-amt]').forEach(el=>{
    const en=DRAFT.entries?.find(x=>x.key===el.dataset.amt);if(en)en.amount=num(el.value);});
}

  DRAFT.remind=DRAFT.remind||{on:true,every:6,from:'10:00',to:'22:00',days:5};
  document.querySelectorAll('#sheetBody [data-rm]').forEach(el=>{
    const k=el.dataset.rm;DRAFT.remind[k]=(k==='every'||k==='days')?+el.value:el.value;});

  const isNew=i<0;

/* ═════ 이벤트 ═════ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
  const a=b.dataset.act;
  if(b.dataset.tab){TAB=b.dataset.tab;render();return;}
  if(a==='close')return close_();
  if(a==='askOk'){const v=document.getElementById('askInput').value.trim();close_();window._askRes?.(v);window._askRes=null;return;}
  if(a==='splashGo')return document.getElementById('splash').classList.remove('on');
  if(a==='whoami')return toast(`${ME.name} · ${ROLE[R()]||ROLE.member}`);
  if(a==='goLedger'){TAB='ledger';render();return;}
  if(a==='copyTxt')return copy(b.dataset.t);
  if(a==='toast')return toast(b.dataset.m);

  /* 게이트 */
  if(a==='gHome')return showGate('welcome');
  if(a==='gJoinView')return showGate('join');
  if(a==='gCreateView')return showGate('create');
  if(a==='gRestoreView')return showGate('restore');

    try{await redeem(JOINCODE,n);showGate(null);render();splash();}

    try{await createClub(n,l);showGate(null);render();splash();}

  if(a==='gRestore'){const c=document.getElementById('rc').value.trim();

    toast('정산부를 만들었어요. 금액은 나중에 적어도 돼요');return;}
  if(a==='rsvp'){const ev=DB.events.find(x=>x.id===b.dataset.id);
    ev.rsvp=ev.rsvp||{};ev.rsvp[ME.id]=b.dataset.v;saveDB();close_(true);render();
    toast(b.dataset.v==='yes'?'참석으로 응답했어요':'불참으로 응답했어요');return;}

    close_();

      `<button class="btn ${m.role===r?'':'ghost'} small" style="margin-bottom:9px" data-act="setRole" data-id="${m.id}" data-r="${r}">
        ${ROLE[r]} <span style="font-weight:600;opacity:.7">· ${ROLE_DESC[r]}</span></button>`).join('')
      +`<button class="btn ghost small" style="margin-bottom:9px" data-act="handOver" data-id="${m.id}">👑 ${ROLE.owner} 넘기기</button>
        <button class="btn ghost small" data-act="memberSheet">← 명단으로</button>`);return;}
  if(a==='setRole'){const m=DB.members.find(x=>x.id===b.dataset.id);m.role=b.dataset.r;
    saveDB();memberSheet();toast('직무를 바꿨어요');return;}
  if(a==='handOver'){if(!await ask(`${ROLE.owner}을 넘길까요?`,`나는 ${ROLE.vice}가 됩니다. 되돌리려면 새 ${ROLE.owner}이 다시 넘겨줘야 해요.`,'넘기기'))return;
    const m=DB.members.find(x=>x.id===b.dataset.id);m.role='owner';
    const me=DB.members.find(x=>x.id===ME.id);if(me)me.role='vice';
    ME.role='vice';saveME();saveDB();close_(true);render();toast('넘겼어요');return;}
  if(a==='mBlock'){if(!gO())return;const m=DB.members.find(x=>x.id===b.dataset.id);
    m.blocked=!m.blocked;saveDB();memberSheet();render();toast(m.blocked?'중지했어요':'해제했어요');return;}
  if(a==='mPurge'){if(!gO())return;const m=DB.members.find(x=>x.id===b.dataset.id);
    if(!await ask(`${m.name} 님을 지울까요?`,'명단에서 완전히 사라져요.<br>과거 정산에 적힌 이름은 남습니다.','영구삭제'))return;
    DB.members=DB.members.filter(x=>x.id!==b.dataset.id);saveDB();memberSheet();render();toast('영구삭제했어요');return;}
  if(a==='settings'){if(!gM())return;return settingsSheet();}
  if(a==='saveSettings'){if(!gM())return;
    DB.name=document.getElementById('setName').value.trim()||'SCALE';
    DB.account={bank:document.getElementById('acBank').value.trim(),
      number:document.getElementById('acNum').value.trim(),
      holder:document.getElementById('acHolder').value.trim()};
    DB.carry[CUR]=num(document.getElementById('setCarry').value);
    DB.roundUnit=+document.getElementById('setUnit').value;
    DB.balanceView=document.getElementById('setBV').value;
    saveDB();close_(true);render();toast('저장했어요');return;}
  if(a==='roleNames'){if(!gO())return;return roleNameSheet();}
  if(a==='saveRoleNames'){const n={};
    document.querySelectorAll('#sheetBody [data-rn]').forEach(el=>{n[el.dataset.rn]=el.value.trim()||ROLE_DEF[el.dataset.rn];});
    DB.roleNames=n;syncRoles();saveDB();close_(true);render();toast('바꿨어요');return;}
  if(a==='resetRoleNames'){DB.roleNames={...ROLE_DEF};syncRoles();saveDB();close_(true);render();toast('되돌렸어요');return;}
  if(a==='newInvite'){if(!gO())return;
    if(!FB.db&&!await cloudInit())return;
    const who=await askText('초대코드 발급','누구에게 줄 코드인가요?');
    if(who===undefined||who===null)return;
    if(who&&DB.members.some(m=>m.name===who.trim())){
      if(!await ask('이미 명단에 있는 이름이에요',`<b>${esc(who)}</b> 님은 이미 등록돼 있어요.<br>새 코드를 쓰면 명단에 두 번 뜹니다.<br><br>기기를 바꾼 경우라면 <b>복구 코드</b>를 알려주는 게 맞아요.`,'그래도 발급',false))return;
    }
    try{const code=await makeInvite(who||'학회원');
      open_('초대코드 발급 완료',`<div class="mini" style="margin-bottom:12px">${esc(who||'학회원')} 님에게 전달하세요. 한 번만 쓸 수 있어요.</div>
        <div class="code" style="font-size:1.4em">${code}</div>
        <button class="btn small" style="margin-top:14px" data-act="copyTxt" data-t="${code}">코드 복사</button>
        <button class="btn ghost small" style="margin-top:9px" data-act="close">닫기</button>`);
    }catch(err){console.error(err);toast('발급 실패');}
    return;}
  if(a==='export'){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);
    a2.download=`SCALE_백업_${iso(new Date())}.json`;a2.click();toast('백업 파일을 내려받았어요');return;}

  /* 알림 */
  if(a==='alerts'){myNotifs().forEach(n=>n.read=true);saveDB();render();
    const list=myNotifs();
    return open_('알림',list.length?list.map(n=>`<div class="card" style="${n.red?'border-color:var(--red);background:#FFF4F5':''}">
      <div class="hd"><b>${n.red?'🔴 ':''}${esc(n.title)}</b></div>
      <div class="sub">${esc(n.body||'')}</div>
      <div class="sub" style="margin-top:4px">${agoLabel(n.at)}</div></div>`).join('')
      :'<div class="empty">알림이 없어요</div>');}
  if(a==='pushToggle'){const m=DB.members.find(x=>x.id===ME.id);if(!m)return;
    m.push=Object.assign({post:true,rsvp:true,poll:true,dm:true,paid:true},m.push);
    m.push[b.dataset.k]=!m.push[b.dataset.k];saveDB();render();
    toast(m.push[b.dataset.k]?'알림을 켰어요':'알림을 껐어요');return;}
  if(a==='doUpdate'){
    b.textContent='적용 중…';b.disabled=true;
    if(SWREG?.waiting)SWREG.waiting.postMessage('SKIP_WAITING');
    setTimeout(()=>location.reload(),1200);return;}
  if(a==='checkUpdate'){
    toast('확인 중…');
    try{await SWREG?.update();}catch(_){}
    setTimeout(()=>{if(!document.getElementById('upbar'))toast('최신 버전이에요');},1500);
    return;}
  if(a==='devWord')return devWord();
  if(a==='notiPreview')return notiPreview();
  if(a==='askPush'){
    b.textContent='켜는 중…';b.disabled=true;
    const ok=await registerPush(false);
    b.textContent='🔔 알림 켜기';b.disabled=false;
    if(ok)showLocal(DB.name,'이제 공지와 마감 알림을 받을 수 있어요',false);
    return;}
  if(a==='fireNoti'){
    const urg=b.dataset.k==='urgent';
    if(!('Notification'in window))return toast('이 브라우저는 알림을 지원하지 않아요');
    let pm=Notification.permission;
    if(pm==='default')pm=await Notification.requestPermission();
    if(pm!=='granted')return toast('알림이 차단됐어요. 폰 설정에서 허용해주세요');
    const ok=await showLocal(
      urg?'🔴 MT 날짜 투표 마감 1시간 전':'입금 확인 완료',
      urg?'아직 참여하지 않으셨어요.':'뒤풀이 회비가 확인됐어요. 감사합니다!',urg);
    toast(ok?'보냈어요. 알림창을 확인해보세요':'알림을 띄우지 못했어요');
    return;}
});
document.addEventListener('input',e=>{
  if(e.target.hasAttribute?.('data-live'))liveCalc();
  if(e.target.hasAttribute?.('data-live2')){pull();const box=document.getElementById('ecalc');
    if(box){const b=balance(),ex=DB.records.some(r=>r.id===DRAFT.id),hit=(DRAFT.payer==='card'||DRAFT.reimbursed);
      const af=ex?b.bal:b.bal-(hit?(+DRAFT.amount||0):0);
      box.innerHTML=`<div class="calc"><div class="l"><span>현재 학회비</span><b>${won(b.bal)}원</b></div>
        <div class="l big"><span>이 지출 반영 후</span><b>${won(af)}원</b></div></div>`;}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='photo'){
    const f=t.files[0];if(!f||!DRAFT)return;
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      pull();DRAFT.receipt=cv.toDataURL('image/jpeg',.6);
      refresh(DRAFT.kind==='party'?partyForm:expenseForm);};img.src=rd.result;};
    rd.readAsDataURL(f);return;}
  if(t.dataset.k==='type'&&t.dataset.q!==undefined){pullBuild();openBuild();return;}
  if((t.dataset.k==='mode'||t.dataset.k==='unit')&&BUILD){pullBuild();openBuild();return;}
});

/* 앱 업데이트 감지 */
let SWREG=null,RELOADING=false;
function showUpdate(){
  if(document.getElementById('upbar'))return;
  const d=document.createElement('div');
  d.id='upbar';d.className='upbar';
  d.innerHTML=`<span>새 버전이 나왔어요</span><button data-act="doUpdate">업데이트</button>`;
  document.body.appendChild(d);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    SWREG=reg;
    if(reg.waiting)showUpdate();
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate();});
    });
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden)reg.update().catch(()=>{});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(RELOADING)return;RELOADING=true;location.reload();});
}
(function(){const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onerror=()=>{};document.head.appendChild(s);})();
render();
cloudInit().then(()=>{
  if(!ME.club)showGate('welcome');
  else if(blocked())showGate('blocked');
  else{splash();registerPush(true);}
});
</script>
